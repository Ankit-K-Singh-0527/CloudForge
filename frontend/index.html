<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="CloudForge — A developer-first platform for deployment automation and cloud infrastructure orchestration."
    />

    <meta name="theme-color" content="#f4f7fc" />

    <title>CloudForge — Infrastructure Control Plane</title>

    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('cloudforge-theme')
          const theme = ['light', 'dark', 'system'].includes(savedTheme) ? savedTheme : 'system'

          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches

          const resolvedTheme = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme

          document.documentElement.classList.toggle('dark', resolvedTheme === 'dark')

          document.documentElement.style.colorScheme = resolvedTheme
        } catch {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
